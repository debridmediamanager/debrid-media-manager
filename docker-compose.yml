version: '3.9'
services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  tor:
    image: debridmediamanager/tor
    deploy:
      replicas: 1

  web:
    image: dmm-prod:latest
    ports:
      - 3000:3000
    env_file:
      - .env
      - .env.local
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - tor
      - redis
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf -m 5 http://localhost:3000/api/healthz | grep -qm1 ok']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 4
      restart_policy:
        # A health kill ends in SIGTERM and a clean exit 0, which on-failure
        # never restarts.
        condition: any

volumes:
  redis_data:
