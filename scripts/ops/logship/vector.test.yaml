# Unit tests for vector.yaml, run by CI before each deploy:
#
#   docker run --rm -v "$PWD/scripts/ops/logship:/etc/vector:ro" \
#     <the logship image in docker-compose.yml> \
#     test /etc/vector/vector.yaml /etc/vector/vector.test.yaml
#
# Each input is a json-file entry as Docker writes it for a dmm_web container,
# and each message the shape of a line dmm_web wrote on dmm-01, with the
# credential swapped for a fake of the same form. One input per test: a test
# with several inputs passes as soon as any one of its events passes.

tests:

  - name: "formats stderr as err"
    inputs:
      - insert_at: web
        type: log
        log_fields:
          message: '{"log":"prisma:error \n","stream":"stderr","attrs":{"com.docker.swarm.task.name":"dmm_web.1.kyd0oq9l9vfi0xbn8nqlrvxpm"},"time":"2026-10-07T12:34:56.789012345Z"}'
    outputs:
      - extract_from: redact
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "2026-10-07T12:34:56.789Z web.1.kyd0oq err prisma:error ")
              assert_eq!(.timestamp, t'2026-10-07T12:34:56.789012345Z')

  - name: "keeps lines of other containers out"
    inputs:
      - insert_at: web
        type: log
        log_fields:
          message: '{"log":"[notice] redis ready\n","stream":"stdout","attrs":{"com.docker.swarm.task.name":"dmm_redis.1.ievn8mn1jcliusi5jl3qhhx6d"},"time":"2026-10-07T12:34:56.789012345Z"}'
    no_outputs_from: [redact]

  - name: "keeps lines without Swarm attrs out"
    inputs:
      - insert_at: web
        type: log
        log_fields:
          message: '{"log":"zrok frontend listening\n","stream":"stdout","time":"2026-10-07T12:34:56.789012345Z"}'
    no_outputs_from: [redact]

  - name: "redacts the Newznab key Next.js prints in its response size warning"
    inputs:
      - insert_at: web
        type: log
        log_fields:
          message: '{"log":"API response for /api/newznab/api?t=get&id=b3BhcXVlLXJlbGVhc2UtaWQ&apikey=0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0 exceeds 4MB. API Routes are meant to respond quickly. https://nextjs.org/docs/messages/api-routes-response-size-limit\n","stream":"stdout","attrs":{"com.docker.swarm.task.name":"dmm_web.1.kyd0oq9l9vfi0xbn8nqlrvxpm"},"time":"2026-10-07T12:34:56.789012345Z"}'
    outputs:
      - extract_from: redact
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "2026-10-07T12:34:56.789Z web.1.kyd0oq out API response for /api/newznab/api?t=get&id=b3BhcXVlLXJlbGVhc2UtaWQ&apikey=REDACTED exceeds 4MB. API Routes are meant to respond quickly. https://nextjs.org/docs/messages/api-routes-response-size-limit")
              assert_eq!(.timestamp, t'2026-10-07T12:34:56.789012345Z')

