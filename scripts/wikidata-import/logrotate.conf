# Installed as /etc/logrotate.d/dmm-wikidata-import on the dmm host.
# `su` because /home/ben/logs is group-writable, which logrotate refuses to
# rotate in as root.
/home/ben/logs/wikidata-import.log {
	su ben ben
	weekly
	maxsize 5M
	rotate 12
	compress
	delaycompress
	missingok
	notifempty
	create 0640 ben ben
}
